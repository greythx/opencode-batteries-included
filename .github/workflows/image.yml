name: image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
  schedule:
    # Every six hours. A new OpenCode release is picked up on the next run.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "OpenCode version without the leading v. Empty means newest release."
        required: false
        type: string

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.check.outputs.build }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      # imagetools talks to the registry directly and buildx is already on the
      # runner, so this job needs no setup step.
      - id: pick
        env:
          INPUT: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT}" ]; then
            version="${INPUT#v}"
            if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "invalid version '${INPUT}': expected X.Y.Z, with or without the leading v" >&2
              exit 1
            fi
          else
            version=$(curl -fsSL \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/anomalyco/opencode/releases?per_page=100" \
              | jq -r '.[] | select(.prerelease == false) | .tag_name' \
              | sed 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n1)
          fi

          if [ -z "${version}" ]; then
            echo "no stable release found" >&2
            exit 1
          fi
          echo "upstream: ${version}"

          # Upstream publishes the image shortly after the release. On the
          # schedule, wait for the next run; a manual run fails instead of
          # reporting success for a build that never happened.
          if ! docker buildx imagetools inspect "ghcr.io/anomalyco/opencode:${version}" >/dev/null 2>&1; then
            if [ "${EVENT}" = "workflow_dispatch" ]; then
              echo "ghcr.io/anomalyco/opencode:${version} does not exist upstream" >&2
              exit 1
            fi
            echo "ghcr.io/anomalyco/opencode:${version} does not exist yet; retrying on the next run"
            echo "build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build=true" >> "${GITHUB_OUTPUT}"

      # Log in only after the upstream check: a token scoped to this repository
      # cannot pull another namespace's package.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: check
        env:
          BUILD: ${{ steps.pick.outputs.build }}
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          build="${BUILD}"

          if [ "${build}" = "true" ] && [ "${EVENT}" != "push" ] && [ -z "${INPUT}" ]; then
            if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "${IMAGE}:${VERSION} already exists"
              build=false
            fi
          fi

          echo "build=${build}" >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.resolve.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest

      # Build and load first, so the smoke test can prove the tools work
      # before anything is published.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: local/opencode-batteries-included:test
          build-args: |
            OPENCODE_VERSION=${{ needs.resolve.outputs.version }}
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh local/opencode-batteries-included:test -c '
            set -eu
            opencode --version
            git --version
            gh --version
            bash --version | head -n1
            python3 --version
            pip --version
            node --version
            npm --version
            npx --version
            uv --version
            uvx --version
            cmake --version | head -n1
            gcc --version | head -n1
            pkg-config --version
            openssl version
          '

      # The amd64 layers come from the builder's cache, so only arm64 compiles
      # under QEMU.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            OPENCODE_VERSION=${{ needs.resolve.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitHub disables scheduled workflows in a public repository after 60 days
  # without activity, which would silently stop every future build.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Touch the repo if it has been quiet
        run: |
          set -euo pipefail
          quiet=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "${quiet}" -lt 45 ]; then
            echo "last commit ${quiet}d ago, nothing to do"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "chore: keep the scheduled build alive"
          git push
